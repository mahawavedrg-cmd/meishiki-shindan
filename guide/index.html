<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>タイプ別 養生ガイド｜命式×更年期</title>
<style>
:root{--ink:#1e2b27;--sub:#64796f;--accent:#1f5f52;--gold:#b0862f;--line:#d7e5dd;--soft:#eef4f1;--jade-soft:#dcefe8}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:#f7faf8;line-height:1.85;
  font-family:"Hiragino Mincho ProN","Yu Mincho",serif;-webkit-text-size-adjust:100%}
.wrap{max-width:680px;margin:0 auto;background:#fff;padding:28px 20px 40px}
.ghead{border-bottom:2px solid var(--gold);padding-bottom:12px;margin-bottom:18px}
.gmark{font-family:sans-serif;font-size:12px;color:var(--gold);letter-spacing:.12em}
.ghead h1{font-size:24px;color:var(--accent);margin:6px 0 2px;line-height:1.4}
.gsub{font-size:13px;color:var(--sub);font-family:sans-serif}
h2{font-size:17px;color:var(--accent);border-left:5px solid var(--gold);padding-left:10px;margin:30px 0 12px}
h3{font-size:14.5px;color:var(--gold);margin:18px 0 6px;font-family:sans-serif}
table{width:100%;border-collapse:collapse;margin:8px 0;font-size:13.5px}
th,td{border:1px solid var(--line);padding:8px 9px;text-align:left}
th{background:var(--soft);color:var(--accent);font-family:sans-serif}
.five{display:block;overflow-x:auto}
.five th{white-space:nowrap}
.lead{font-size:14.5px;background:var(--soft);padding:14px;border-radius:8px}
ul.check{list-style:none;padding:0;margin:8px 0;font-size:14.5px}
ul.check li{padding:7px 0 7px 26px;position:relative}
ul.check li:before{content:"\2610";position:absolute;left:0;color:var(--gold);font-size:16px}
blockquote{margin:16px 0;padding:14px 16px;background:var(--jade-soft);border-left:4px solid var(--gold);
  font-size:14px;color:#3a4a44}
.rule{font-size:14px}
.score{background:#fff6e0;border:1px solid var(--gold);border-radius:10px;padding:14px 16px;font-size:14px;margin:14px 0;color:#5a4a1e}
.score b{color:var(--accent);font-size:15px}
.next{background:var(--soft);border-radius:10px;padding:16px;font-size:14px;margin-top:26px}
.next b{color:var(--accent)}
.btn{display:block;text-align:center;font-family:sans-serif;font-size:14px;font-weight:600;
  margin:18px auto 0;padding:13px 18px;border-radius:10px;border:1px solid var(--line);
  background:#fff;color:var(--accent);text-decoration:none;cursor:pointer;width:100%}
footer.disc{font-family:sans-serif;font-size:11.5px;color:var(--sub);margin-top:28px;
  border-top:1px solid var(--line);padding-top:12px}
nav.types{font-family:sans-serif;font-size:13.5px;margin-top:10px}
nav.types a{display:block;padding:12px 14px;margin:8px 0;border:1px solid var(--line);
  border-radius:10px;color:var(--accent);text-decoration:none;background:#fff}
@media print{
  body{background:#fff}
  .wrap{max-width:none;padding:14mm 12mm}
  .btn{display:none}
  h2{page-break-after:avoid}
  @page{size:A4;margin:0}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="ghead">
    <div class="gmark">龍の鑑定師コウ｜命式×更年期</div>
    <h1>タイプ別 養生ガイド</h1>
    <div class="gsub">あなたのタイプを選んでください</div>
  </div>
  <nav class="types"><a href="./ki/">木タイプ（甲・乙）の養生ガイド</a><a href="./hi/">火タイプ（丙・丁）の養生ガイド</a><a href="./tsuchi/">土タイプ（戊・己）の養生ガイド</a><a href="./kin/">金タイプ（庚・辛）の養生ガイド</a><a href="./mizu/">水タイプ（壬・癸）の養生ガイド</a></nav>
  <footer class="disc">
    自分のタイプがわからない方は <a href="https://mahawavedrg-cmd.github.io/meishiki-shindan/">30秒の命式診断</a> から。<br>
    ※四柱推命の五行理論にもとづく体質傾向の参考情報です。医療の診断ではありません。
  </footer>
</div>
<script data-goatcounter="https://meishiki-shindan.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
